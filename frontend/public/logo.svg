<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Archival Ring -->
  <circle cx="50" cy="50" r="46" stroke="#B89A5A" stroke-width="1.75" stroke-dasharray="2 2" opacity="0.6"/>
  <circle cx="50" cy="50" r="43" stroke="#B89A5A" stroke-width="1.25"/>

  <!-- Cartographic Cardinal Ticks -->
  <line x1="50" y1="3" x2="50" y2="7" stroke="#B89A5A" stroke-width="2"/>
  <line x1="50" y1="93" x2="50" y2="97" stroke="#B89A5A" stroke-width="2"/>
  <line x1="3" y1="50" x2="7" y2="50" stroke="#B89A5A" stroke-width="2"/>
  <line x1="93" y1="50" x2="97" y2="50" stroke="#B89A5A" stroke-width="2"/>

  <!-- Deep Atlas Navy Solid Badge Shield -->
  <rect x="18" y="18" width="64" height="64" rx="16" fill="#0E1D61" stroke="#B89A5A" stroke-width="2"/>

  <!-- Isometric Warehouse Cube (Spatial Bin Mapping) -->
  <!-- Top Face -->
  <polygon points="50,27 69,38 50,49 31,38" fill="#162C8C" stroke="#B89A5A" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="31,38 50,49 50,71 31,60" fill="#0A1545" stroke="#B89A5A" stroke-width="1.75" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="50,49 69,38 69,60 50,71" fill="#0E1D61" stroke="#B89A5A" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Navigational Compass Star Core (The Pilot) -->
  <polygon points="50,34 53,46 65,49 53,52 50,64 47,52 35,49 47,46" fill="#B89A5A" stroke="#E8E0D2" stroke-width="1"/>

  <!-- Center Focal Axis Point -->
  <circle cx="50" cy="49" r="2.5" fill="#E8E0D2"/>
</svg>
