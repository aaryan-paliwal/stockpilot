<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Password Recovery</title>
  <script src="https://cdn.tailwindcss.com"></script>
      <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'IBM Plex Mono', 'monospace'],
            carto: ['Space Mono', 'monospace'],
            blueprint: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            ivory: {
              DEFAULT: '#E8E0D2',
              50: '#FAF8F5',
              100: '#F4EFE6',
              200: '#E8E0D2',
              300: '#DDD2BF',
              400: '#C8BA9F'
            },
            gold: {
              DEFAULT: '#B89A5A',
              300: '#D6C08D',
              400: '#C7AD72',
              500: '#B89A5A',
              600: '#9B7E3E',
              700: '#7E6329'
            },
            navy: {
              DEFAULT: '#0E1D61',
              800: '#142578',
              900: '#0E1D61',
              950: '#070F35'
            },
            brand: {
              500: '#0E1D61',
              600: '#070F35'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="shared.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body class="bg-[#E8E0D2] text-[#0E1D61] min-h-screen bg-grid-pattern relative flex flex-col justify-between transition-colors duration-200">

  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-b from-blue-500/15 via-indigo-500/5 to-transparent rounded-full blur-[100px] pointer-events-none"></div>

  <header class="p-6 flex items-center justify-between relative z-10">
    <a href="landing.html" class="flex items-center gap-2.5 group">
        <img src="logo.svg" alt="StockPilot" class="w-9 h-9 rounded-xl border-2 border-[#B89A5A] shadow-md shadow-[#0E1D61]/20 object-cover transition-transform group-hover:scale-105">
        <span class="font-black text-base text-[#0E1D61] font-atlas tracking-tight">StockPilot</span>
      </a>
    
  </header>

  <main class="flex-1 flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-md bg-white/80/85 border border-[#B89A5A]/35 p-8 rounded-3xl shadow-2xl backdrop-blur-xl space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-[#0E1D61]/15 text-[#0E1D61] border border-[#B89A5A]/40 mx-auto flex items-center justify-center text-xl">
          🔑
        </div>
        <h2 class="text-2xl font-black text-[#0E1D61] tracking-tight">Reset Password</h2>
        <p class="text-xs text-[#0E1D61]/70">Enter your authorized account email and we'll dispatch cryptographic recovery instructions.</p>
      </div>

      <!-- Success Notification Mockup (Hidden by default) -->
      <div id="recovery-success" class="hidden animate-carto-reveal p-4 rounded-2xl bg-[#B89A5A]/10 border border-emerald-500/30 text-[#B89A5A] text-xs space-y-1">
        <div class="font-bold">✓ Recovery Link Dispatched</div>
        <p class="text-[11px] text-[#0E1D61]/80/80">If an account matches that email, check your inbox for temporary access instructions.</p>
      </div>

      <form id="recovery-form" onsubmit="event.preventDefault(); document.getElementById('recovery-success').classList.remove('hidden');" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Work Email</label>
          <input type="email" required placeholder="alex@warehouse.internal" class="w-full px-4 py-2.5 rounded-xl bg-[#E8E0D2]/60 border border-[#B89A5A]/35 text-[#0E1D61] font-mono focus:outline-none focus:border-[#B89A5A] focus:ring-2 focus:ring-[#B89A5A]/20 transition-all duration-200">
        </div>

        <button type="submit" class="w-full py-3 btn-gold-shimmer transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.98] bg-[#0E1D61] hover:bg-[#162C8C] text-[#E8E0D2] border border-[#B89A5A] rounded-xl shadow-md shadow-[#0E1D61]/25 font-bold shadow-lg shadow-[#0E1D61]/30 transition-all text-xs cursor-pointer">
          Send Recovery Instructions &rarr;
        </button>
      </form>

      <div class="text-center pt-2 text-xs">
        <a href="login.html" class="text-[#0E1D61]/70 hover:text-slate-900 font-semibold flex items-center justify-center gap-1">
          &larr; Back to Sign In
        </a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-[#0E1D61]/70">
    &copy; 2026 StockPilot Inc.
  </footer>

  <script src="nav-component.js"></script>
</body>
</html>
