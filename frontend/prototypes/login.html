<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPilot - Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
      <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            mono: ['Space Mono', 'IBM Plex Mono', 'monospace'],
            carto: ['Space Mono', 'monospace'],
            blueprint: ['IBM Plex Mono', 'monospace'],
          },
          colors: {
            ivory: {
              DEFAULT: '#E8E0D2',
              50: '#FAF8F5',
              100: '#F4EFE6',
              200: '#E8E0D2',
              300: '#DDD2BF',
              400: '#C8BA9F'
            },
            gold: {
              DEFAULT: '#B89A5A',
              300: '#D6C08D',
              400: '#C7AD72',
              500: '#B89A5A',
              600: '#9B7E3E',
              700: '#7E6329'
            },
            navy: {
              DEFAULT: '#0E1D61',
              800: '#142578',
              900: '#0E1D61',
              950: '#070F35'
            },
            brand: {
              500: '#0E1D61',
              600: '#070F35'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="shared.css">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body class="bg-[#E8E0D2] text-[#0E1D61] min-h-screen bg-grid-pattern relative flex flex-col justify-between transition-colors duration-200">

  <!-- Ambient light -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[350px] bg-gradient-to-b from-blue-500/15 via-indigo-500/5 to-transparent rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Top bar -->
  <header class="p-6 flex items-center justify-between relative z-10">
    <a href="landing.html" class="flex items-center gap-2.5 group">
        <img src="logo.svg" alt="StockPilot" class="w-9 h-9 rounded-xl border-2 border-[#B89A5A] shadow-md shadow-[#0E1D61]/20 object-cover transition-transform group-hover:scale-105">
        <span class="font-black text-base text-[#0E1D61] font-atlas tracking-tight">StockPilot</span>
      </a>
    
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center p-6 relative z-10">
    <div class="w-full max-w-md bg-white/80/85 border border-[#B89A5A]/35 p-8 rounded-3xl shadow-2xl backdrop-blur-xl space-y-6">
      
      <div class="text-center space-y-2">
        <h2 class="text-2xl font-black text-[#0E1D61] tracking-tight">Welcome Back</h2>
        <p class="text-xs text-[#0E1D61]/70">Sign in to orchestrate your warehouse inventory</p>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-slate-700 mb-1">Work Email</label>
          <input type="email" required value="admin@stockpilot.internal" class="w-full px-4 py-2.5 rounded-xl bg-[#E8E0D2]/60 border border-[#B89A5A]/35 text-[#0E1D61] font-mono focus:outline-none focus:border-[#B89A5A] focus:ring-2 focus:ring-[#B89A5A]/20 transition-all duration-200">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-semibold text-slate-700">Password</label>
            <a href="forgot_password.html" class="text-[#0E1D61] hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="pwd-input" type="password" required value="••••••••••••" class="w-full px-4 py-2.5 rounded-xl bg-[#E8E0D2]/60 border border-[#B89A5A]/35 text-[#0E1D61] font-mono focus:outline-none focus:border-[#B89A5A] focus:ring-2 focus:ring-[#B89A5A]/20 transition-all duration-200">
            <button type="button" onclick="togglePwdVisibility()" class="absolute right-3 top-2.5 text-[#0E1D61]/70 hover:text-slate-200">
              👁️
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="remember" checked class="rounded accent-blue-600">
          <label for="remember" class="text-[#0E1D61]/70 text-xs select-none">Remember this device for 30 days</label>
        </div>

        <button type="submit" class="w-full py-3 btn-gold-shimmer transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.98] bg-[#0E1D61] hover:bg-[#162C8C] text-[#E8E0D2] border border-[#B89A5A] rounded-xl shadow-md shadow-[#0E1D61]/25 font-bold shadow-lg shadow-[#0E1D61]/30 transition-all text-xs cursor-pointer">
          Sign In to Workspace &rarr;
        </button>
      </form>

      <div class="relative flex items-center justify-center">
        <div class="border-t border-[#B89A5A]/35 w-full"></div>
        <span class="bg-[#F4EFE6] px-3 text-[10px] uppercase font-bold text-[#0E1D61]/70 absolute">or sign in with</span>
      </div>

      <!-- OAuth Buttons -->
      <div class="grid grid-cols-2 gap-3 text-xs">
        <button onclick="window.location.href='dashboard.html';" class="py-2.5 rounded-xl border border-[#B89A5A]/35 hover:bg-[#E8E0D2]/60 font-semibold text-slate-700 flex items-center justify-center gap-2 transition-colors">
          <span>🇬</span> Google SSO
        </button>
        <button onclick="window.location.href='dashboard.html';" class="py-2.5 rounded-xl border border-[#B89A5A]/35 hover:bg-[#E8E0D2]/60 font-semibold text-slate-700 flex items-center justify-center gap-2 transition-colors">
          <span>🐙</span> GitHub
        </button>
      </div>

      <div class="text-center pt-2 text-xs text-[#0E1D61]/70">
        Don't have an account yet? <a href="register.html" class="text-[#0E1D61] font-bold hover:underline">Create account</a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-[#0E1D61]/70">
    &copy; 2026 StockPilot Inc. • Safe & encrypted enterprise authentication
  </footer>

  <script>
    function togglePwdVisibility() {
      const inp = document.getElementById('pwd-input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }
  </script>
  <script src="nav-component.js"></script>
</body>
</html>
