spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db?options=-c%20timezone=UTC}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true

app:
  auth:
    dev-mode: true

jwt:
  secret: test_super_secret_key_for_testing_purposes_only_at_least_32_chars
  expiration: 86400000
