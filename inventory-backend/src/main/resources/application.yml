server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  name: StockIQ Inventory Management System

  auth:
    dev-mode: ${AUTH_DEV_MODE:false}

  notification:
    delete-days: 30
    batch-size: 100
    cron: "0 0 4 * * *"
    low-stock-cron: "*/30 * * * * *"
    time-zone: Asia/Colombo
    date-time-format: "yyyy-MM-dd HH:mm:ss"

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
