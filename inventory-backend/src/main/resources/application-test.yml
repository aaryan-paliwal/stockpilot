spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  auth:
    dev-mode: true

jwt:
  secret: test_super_secret_key_for_testing_purposes_only_at_least_32_chars
  expiration: 86400000
